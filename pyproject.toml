[build-system]
requires = ["setuptools>=39.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 132

[tool.isort]
known_first_party = "melodies_monet"
profile = "black"
line_length = 132

[tool.ruff]
line-length = 132

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]
