analysis:
  start_time: '2024-09-05'
  end_time: '2024-09-07'
  debug: true
  output_dir: ./
  output_dir_read: ./
  save:
    paired:
      method: netcdf
      data: all
  read:
    paired:
      method: netcdf
      filenames:
        tempo_l2_no2_wrfchem_v4.2:
        - tempo_l2_no2_wrfchem_v4.2.nc4
data:
  wrfchem_v4.2:
    files: /glade/campaign/acom/acom-da/shawnh/AQ_WATCH/20240905/wrf/wrfout_hourly_d02_2024-09-0[5-7]*
    mod_type: wrfchem
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      tempo_l2_no2:
        no2: vertical_column_troposphere
    projection: null
    surf_only: false
    type: model
  tempo_l2_no2:
    debug: true
    filename: /glade/campaign/acom/acom-da/sma/TEMPO_NO2_V03/TEMPO_NO2_L2_V03_20240906*_S0*
    obs_type: sat_swath_clm
    sat_type: tempo_l2_no2
    variables:
      main_data_quality_flag:
        main_data_quality_flag_max: 0
        var_applied:
        - vertical_column_troposphere
      vertical_column_troposphere:
        ylabel_plot: NO2 trop. column
      pressure: {}
      tropopause_pressure: {}
      scattering_weights: {}
      amf_troposphere: {}
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    - auto-region:giorgi
    - auto-region:custom
    domain_name:
    - CONUS
    - CNA
    - custom
    domain_box:
    - 37
    - -108
    - 40
    - -102
    data:
    - tempo_l2_no2_wrfchem_v4.2
    data_proc:
      ts_offset: (-4, 'h')
      ts_avg_window: h
      set_axis: true
  plot_grp2:
    type: gridded_spatial_bias
    fig_kwargs:
      states: true
      counties: true
    text_kwargs:
      fontsize: 16
    domain_type:
    - all
    - all
    domain_name:
    - CONUS
    - model
    data:
    - tempo_l2_no2_wrfchem_v4.2
    data_proc:
      set_axis: true
  plot_grp3:
    type: spatial_dist
    fig_kwargs:
      states: true
      counties: true
    text_kwargs:
      fontsize: 16
    domain_type:
    - all
    - all
    domain_name:
    - CONUS
    - model
    data:
    - tempo_l2_no2_wrfchem_v4.2
    data_proc:
      set_axis: true
      vmax: 1e15
      vmin: 0
  plot_grp4:
    type: taylor
    data:
    - tempo_l2_no2_wrfchem_v4.2
    domain_type:
    - all
    domain_name:
    - CONUS
    data_proc:
      set_axis: true
      ty_scale: 1.5
    default_plot_kwargs:
      markersize: 10.0
      marker: s
stats:
  stat_list:
  - MB
  - MdnB
  - R2
  - RMSE
  round_output: 2
  output_table: false
  output_table_kwargs:
    figsize:
    - 7
    - 3
    fontsize: 12.0
    xscale: 1.4
    yscale: 1.4
    edges: horizontal
  domain_type:
  - all
  domain_name:
  - CONUS
  data:
  - tempo_l2_no2_wrfchem_v4.2
