analysis:
  start_time: '2023-06-27'
  end_time: '2023-06-28'
  debug: false
  output_dir: /scratch1/BMC/rcm2/mbruckner/iagos
data:
  ufsaqm:
    files: /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/UFS-AQM/cmaq54_OriRave1/aqm.202306*/12/aqm.t12z.dyn.*.nc
    mod_type: ufs
    variables:
      pres_pa_mid:
        rename: pressure_model
        unit_scale: 1
        unit_scale_method: '*'
      temperature_k:
        rename: temp_model
        unit_scale: 1
        unit_scale_method: '*'
    mapping:
      iagos:
        co: CO_P1
    plot_kwargs:
      color: purple
      marker: ^
      linestyle: dotted
    type: model
  iagos:
    filename: /scratch1/BMC/rcm2/mbruckner/iagos/IAGOS_timeseries_2023062701364109_L2_3.1.0.nc4
    obs_type: aircraft
    time_var: UTC_time
    variables:
      O3_P1:
        unit_scale: 1
        unit_scale_method: '*'
      CO_P1:
        unit_scale: 1
        unit_scale_method: '*'
      lon:
        rename: longitude
      lat:
        rename: latitude
      baro_alt_AC:
        rename: altitude
      air_press_AC:
        rename: pressure_obs
        unit_scale: 1
        unit_scale_method: '*'
      air_temp_AC:
        rename: temp_obs
        unit_scale: 1
        unit_scale_method: '*'
      UTC_time:
        rename: time
    type: obs
plotting:
  plot_grp2:
    type: vertprofile
    fig_kwargs:
      figsize:
      - 10
      - 14
    default_plot_kwargs:
      linewidth: 4.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - ' '
    data:
    - iagos_ufsaqm
    data_proc:
      rem_obs_nan: true
      set_axis: false
      interquartile_style: shading
    altitude_variable: altitude
    vertprofile_bins:
    - 0
    - 1000
    - 2000
    - 3000
    - 4000
    - 5000
    - 6000
    - 7000
    - 8000
    - 9000
    - 10000
    - 11000
    - 12000
