analysis:
  start_time: '2019-07-15'
  end_time: '2019-07-19'
  output_dir: /ships19/aqda/mbruckner/Mopitt_mm_test
  debug: true
data:
  raqms:
    files: /ships19/aqda/mbruckner/monet_plots/mopitt_example_raqms/uwhyb*nc
    mod_type: raqms
    apply_ak: true
    variables:
      ico:
        need: true
    mapping:
      mopitt_l3:
        ico: column
    plot_kwargs:
      color: purple
      marker: ^
      linestyle: dotted
    type: model
  mopitt_l3:
    filename: /ships19/aqda/mbruckner/Mopitt_mm_test/MOP03J-201907*he5
    obs_type: sat_grid_clm
    sat_type: mopitt_l3
    variables:
      column:
        ylabel_plot: $10^{18} molec/cm^{2}$
    type: obs
plotting:
  plot_grp3:
    type: gridded_spatial_bias
    fig_kwargs:
      states: true
      figsize:
      - 10
      - 5
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - Global
    data:
    - mopitt_l3_raqms
    data_proc:
      rem_obs_nan: true
      set_axis: true
  plot_grp2:
    type: taylor
    fig_kwargs:
      figsize:
      - 8
      - 8
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - Global
    data:
    - mopitt_l3_raqms
    data_proc:
      rem_obs_nan: true
      set_axis: true
