analysis:
  start_time: 2019-09-05-12:00:00
  end_time: 2019-09-06-00:00:00
  output_dir: /wrk/charkins/melodies_monet/aircraft/analysis
  debug: true
data:
  wrfchem_v4.2:
    files: /wrk/d2/rschwantes/wrf/firex_mech/qzhu/run_CONUS_fv19_BEIS_1.0xISO_RACM_v4.2.2_racm_berk_vcp_noI_phot_soa/0905/*
    mod_type: wrfchem
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      firexaq:
        no2: NO2_CL_RYERSON
        'no': NO_CL_RYERSON
        o3: O3_CL_RYERSON
    variables:
      pres_pa_mid:
        rename: pressure_model
        unit_scale: 1
        unit_scale_method: '*'
      temperature_k:
        rename: temp_model
        unit_scale: 1
        unit_scale_method: '*'
    projection: None
    plot_kwargs:
      color: dodgerblue
      marker: ^
      linestyle: ':'
    type: model
  firexaq:
    filename: /wrk/d2/rschwantes/obs/firex-aq/R1/10s_merge/firexaq-mrg10-dc8_merge_20190905_R1.ict
    obs_type: aircraft
    resample: 600S
    variables:
      O3_CL_RYERSON:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: Ozone (ppbv)
        vmin_plot: 15.0
        vmax_plot: 55.0
        vdiff_plot: 20.0
      NO_CL_RYERSON:
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: NO (ppbv)
        vmin_plot: 0.0
        vmax_plot: 20.0
        vdiff_plot: 15.0
        nlevels_plot: 21
      NO2_CL_RYERSON:
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: NO2 (ppbv)
        vmin_plot: 0.0
        vmax_plot: 20.0
        vdiff_plot: 15.0
        nlevels_plot: 21
      Latitude_YANG:
        rename: latitude
        unit_scale: 1
        unit_scale_method: '*'
      Longitude_YANG:
        rename: longitude
        unit_scale: 1
        unit_scale_method: '*'
      P_BUI:
        rename: pressure_obs
        unit_scale: 100
        unit_scale_method: '*'
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      ts_select_time: time
      ts_avg_window: h
      set_axis: false
  plot_grp2:
    type: taylor
    fig_kwargs:
      figsize:
      - 8
      - 8
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: true
  plot_grp3:
    type: boxplot
    fig_kwargs:
      figsize:
      - 8
      - 6
    text_kwargs:
      fontsize: 20.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: false
stats:
  stat_list:
  - MB
  - MdnB
  - R2
  - RMSE
  round_output: 2
  output_table: false
  output_table_kwargs:
    figsize:
    - 7
    - 3
    fontsize: 12.0
    xscale: 1.4
    yscale: 1.4
    edges: horizontal
  domain_type:
  - all
  domain_name:
  - CONUS
  data:
  - firexaq_wrfchem_v4.2
