analysis:
  start_time: 2019-09-05-00:00:00
  end_time: 2019-09-06-00:00:00
  output_dir: /wrk/charkins/melodies_monet/aircraft/analysis_saveout2
  output_dir_save: /wrk/charkins/melodies_monet/aircraft/analysis_saveout2/savedir_test
  output_dir_read: /wrk/charkins/melodies_monet/aircraft/analysis_saveout2/readdir_test
  debug: true
  save:
    paired:
      method: netcdf
      prefix: 0905
      data: all
  read:
    paired:
      method: netcdf
      filenames:
        airnow_wrfchem_v4.2:
        - 0904_airnow_wrfchem_v4.2.nc4
        - 0905_airnow_wrfchem_v4.2.nc4
data:
  wrfchem_v4.2:
    files: /wrk/d2/charkins/melodies-monet_data/wrfchem/run_CONUS_fv19_BEIS_1.0xISO_RACM_v4.2.2_racm_berk_vcp_noI_phot_soa/0905/wrfout_d01_2019-09-05_*
    mod_type: wrfchem
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      airnow:
        co: CO
        no2: NO2
        'no': 'NO'
        o3: OZONE
    projection: null
    plot_kwargs:
      color: dodgerblue
      marker: ^
      linestyle: ':'
    type: model
  airnow:
    use_airnow: true
    filename: /wrk/d2/charkins/melodies-monet_data/airnow/AIRNOW_20190901_20190930.nc
    obs_type: pt_sfc
    variables:
      PM2.5:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -1.0
        ylabel_plot: PM2.5 (ug/m3)
        ty_scale: 2.0
        vmin_plot: 0.0
        vmax_plot: 22.0
        vdiff_plot: 15.0
        nlevels_plot: 23
      OZONE:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -1.0
        ylabel_plot: Ozone (ppbv)
        vmin_plot: 15.0
        vmax_plot: 55.0
        vdiff_plot: 20.0
        nlevels_plot: 21
      WS:
        unit_scale: 0.514
        unit_scale_method: '*'
        obs_min: 0.2
      PRSFC:
        unit_scale: 0.01
        unit_scale_method: '*'
      PRECIP:
        unit_scale: 0.1
        unit_scale_method: '*'
      TEMP:
        unit_scale: 273.16
        unit_scale_method: '-'
      CO:
        unit_scale: 1000.0
        unit_scale_method: '*'
        nan_value: -1.0
        ylabel_plot: CO (ppbv)
        vmin_plot: 50.0
        vmax_plot: 750.0
        vdiff_plot: 400.0
        nlevels_plot: 15
      SO2:
        nan_value: -1.0
        ylabel_plot: SO2 (ppbv)
      'NO':
        nan_value: -1.0
        ylabel_plot: NO (ppbv)
        vmin_plot: 0.0
        vmax_plot: 20.0
        vdiff_plot: 15.0
        nlevels_plot: 21
      NO2:
        nan_value: -1.0
        ylabel_plot: NO2 (ppbv)
        vmin_plot: 0.0
        vmax_plot: 20.0
        vdiff_plot: 15.0
        nlevels_plot: 21
    type: obs
