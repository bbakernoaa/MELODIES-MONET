analysis:
  output_dir: /wrk/charkins/melodies_monet/aircraft/develop_aircraft_looping/output
  debug: true
data:
  wrfchem_v4.2:
    mod_type: wrfchem
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      firexaq:
        no2: NO2_CL_RYERSON
        'no': NO_CL_RYERSON
        o3: O3_CL_RYERSON
    variables:
      pres_pa_mid:
        rename: pressure_model
        unit_scale: 1
        unit_scale_method: '*'
      temperature_k:
        rename: temp_model
        unit_scale: 1
        unit_scale_method: '*'
    projection: null
    type: model
  firexaq:
    obs_type: aircraft
    resample: 600S
    variables:
      O3_CL_RYERSON:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
      NO_CL_RYERSON:
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
      NO2_CL_RYERSON:
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
      Latitude_YANG:
        rename: latitude
        unit_scale: 1
        unit_scale_method: '*'
      Longitude_YANG:
        rename: longitude
        unit_scale: 1
        unit_scale_method: '*'
      P_BUI:
        rename: pressure_obs
        unit_scale: 100
        unit_scale_method: '*'
      MSL_GPS_Altitude_YANG:
        rename: altitude
        unit_scale: 1
        unit_scale_method: '*'
    type: obs
