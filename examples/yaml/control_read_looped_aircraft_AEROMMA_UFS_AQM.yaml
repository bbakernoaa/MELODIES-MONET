analysis:
  start_time: 2023-06-27-00:00:00
  end_time: 2023-06-28-23:59:00
  output_dir: /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/processed/submit_plots
  debug: true
  read:
    paired:
      method: netcdf
      filenames:
        aeromma_ufsaqm:
        - /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/processed/submit/0627_L1_aeromma_ufsaqm.nc4
        - /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/processed/submit/0627_L2_aeromma_ufsaqm.nc4
        - /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/processed/submit/0628_L1_aeromma_ufsaqm.nc4
data:
  ufsaqm:
    files: /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/UFS-AQM/cmaq54_OriRave1/aqm.20230627/12/aqm.t12z.dyn.f001.nc
    mod_type: ufs
    mapping:
      aeromma:
        no2_ave: NO2_LIF
        no_ave: NO_LIF
        o3_ave: O3_CL
        co: CO_LGR
    variables:
      pres_pa_mid:
        rename: pressure_model
        unit_scale: 1
        unit_scale_method: '*'
      temperature_k:
        rename: temp_model
        unit_scale: 1
        unit_scale_method: '*'
    projection: null
    plot_kwargs:
      color: dodgerblue
      marker: ^
      linestyle: ':'
    type: model
  aeromma:
    filename: /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/obs_short/short_AEROMMA-Merge_20230627_L1_20240410_1459.csv
    obs_type: aircraft
    time_var: Time_Start
    resample: 30s
    variables:
      O3_CL:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
        ylabel_plot: O3 (ppbv)
      NO_LIF:
        unit_scale: 1000.0
        unit_scale_method: /
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
        ylabel_plot: NO (ppbv)
      NO2_LIF:
        unit_scale: 1000.0
        unit_scale_method: /
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
        ylabel_plot: NO2 (ppbv)
      CO_LGR:
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
        ylabel_plot: CO (ppbv)
      G_LAT:
        rename: latitude
        unit_scale: 1
        unit_scale_method: '*'
      G_LONG:
        rename: longitude
        unit_scale: 1
        unit_scale_method: '*'
      PW:
        rename: pressure_obs
        unit_scale: 100
        unit_scale_method: '*'
      TW:
        rename: temp_obs
        unit_scale: 1
        unit_scale_method: '*'
      G_ALT:
        rename: altitude
        unit_scale: 1
        unit_scale_method: '*'
      Time_Start:
        rename: time
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 5.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - Los Angeles
    data:
    - aeromma_ufsaqm
    data_proc:
      rem_obs_nan: true
      ts_select_time: time
      set_axis: false
      altitude_yax2:
        altitude_variable: altitude
        altitude_ticks: 1000
        ylabel2: Altitude (m)
        plot_kwargs_y2:
          color: g
        altitude_unit: m
        altitude_scaling_factor: 1
  plot_grp2:
    type: vertprofile
    fig_kwargs:
      figsize:
      - 10
      - 14
    default_plot_kwargs:
      linewidth: 4.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - Los Angeles
    data:
    - aeromma_ufsaqm
    data_proc:
      rem_obs_nan: true
      set_axis: false
      interquartile_style: shading
    altitude_variable: altitude
    vertprofile_bins:
    - 0
    - 500
    - 1000
    - 1500
    - 2000
    - 2500
    - 3000
    - 3500
    - 4000
    vmin: null
    vmax: null
  plot_grp3:
    type: violin
    fig_kwargs:
      figsize:
      - 10
      - 8
    text_kwargs:
      fontsize: 25.0
    domain_type:
    - all
    domain_name:
    - Los Angeles
    data:
    - aeromma_ufsaqm
    data_proc:
      rem_obs_nan: true
      set_axis: false
  plot_grp4:
    type: scatter_density
    fig_kwargs:
      figsize:
      - 10
      - 10
    default_plot_kwargs:
      linewidth: 4.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - Los Angeles
    data:
    - aeromma_ufsaqm
    data_proc:
      rem_obs_nan: true
      set_axis: false
      vmin_x: null
      vmax_x: null
      vmin_y: null
      vmax_y: null
    color_map:
      colors:
      - royalblue
      - cyan
      - yellow
      - orange
      over: red
      under: blue
    xlabel: Model
    ylabel: Observation
    title: Scatter Density Plot
    fill: true
    shade_lowest: true
    vcenter: null
    extensions:
    - min
    - max
  plot_grp5:
    type: taylor
    fig_kwargs:
      figsize:
      - 8
      - 8
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - Los Angeles
    data:
    - aeromma_ufsaqm
    data_proc:
      rem_obs_nan: true
      set_axis: false
  plot_grp6:
    type: boxplot
    fig_kwargs:
      figsize:
      - 8
      - 6
    text_kwargs:
      fontsize: 20.0
    domain_type:
    - all
    domain_name:
    - Los Angeles
    data:
    - aeromma_ufsaqm
    data_proc:
      rem_obs_nan: true
      set_axis: false
