analysis:
  start_time: 2019-07-22-00:00:00
  end_time: 2019-09-05-23:59:00
  output_dir: /wrk/charkins/melodies_monet/aircraft/develop_aircraft_looping/output
  debug: true
  read:
    paired:
      method: netcdf
      filenames:
        firexaq_wrfchem_v4.2:
        - /wrk/charkins/melodies_monet/aircraft/develop_aircraft_looping/output/0722_firexaq_wrfchem_v4.2.nc4
        - /wrk/charkins/melodies_monet/aircraft/develop_aircraft_looping/output/0905_firexaq_wrfchem_v4.2.nc4
data:
  wrfchem_v4.2:
    files: /wrk/charkins/melodies_monet/aircraft/develop_aircraft_looping/all_days_model/*
    mod_type: wrfchem
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      firexaq:
        no2: NO2_CL_RYERSON
        'no': NO_CL_RYERSON
        o3: O3_CL_RYERSON
    variables:
      pres_pa_mid:
        rename: pressure_model
        unit_scale: 1
        unit_scale_method: '*'
      temperature_k:
        rename: temp_model
        unit_scale: 1
        unit_scale_method: '*'
    projection: null
    plot_kwargs:
      color: dodgerblue
      marker: ^
      linestyle: ':'
    type: model
  firexaq:
    filename: /wrk/d2/rschwantes/obs/firex-aq/R1/10s_merge/firexaq-mrg10-dc8_merge_20190905_R1.ict
    obs_type: aircraft
    resample: 600S
    variables:
      O3_CL_RYERSON:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
      NO_CL_RYERSON:
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
      NO2_CL_RYERSON:
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
      Latitude_YANG:
        rename: latitude
        unit_scale: 1
        unit_scale_method: '*'
      Longitude_YANG:
        rename: longitude
        unit_scale: 1
        unit_scale_method: '*'
      P_BUI:
        rename: pressure_obs
        unit_scale: 100
        unit_scale_method: '*'
      MSL_GPS_Altitude_YANG:
        rename: altitude
        unit_scale: 1
        unit_scale_method: '*'
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      ts_select_time: time
      ts_avg_window: null
      set_axis: false
      altitude_yax2:
        altitude_variable: altitude
        altitude_ticks: 1000
        ylabel2: Altitude (m)
        plot_kwargs_y2:
          color: g
        altitude_unit: m
        altitude_scaling_factor: 1
