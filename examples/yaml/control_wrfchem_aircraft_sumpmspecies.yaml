analysis:
  start_time: 2019-09-05-12:00:00
  end_time: 2019-09-06-00:00:00
  output_dir: /wrk/charkins/melodies_monet/aircraft/develop_sumvars/output
  debug: true
data:
  wrfchem_v4.2:
    files: /wrk/d2/rschwantes/wrf/firex_mech/wrfchem_example/racm_esrl/*
    mod_type: wrfchem
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      firexaq:
        oa_tot: OA_PM1_AMS_JIMENEZ
        SO4A: Sulfate_PM1_AMS_JIMENEZ
        NH4A: Ammonium_PM1_AMS_JIMENEZ
        NO3A: Nitrate_PM1_AMS_JIMENEZ
        EC: BC_mass_90_550_nm_SCHWARZ
    variables:
      pres_pa_mid:
        rename: pressure_model
        unit_scale: 1
        unit_scale_method: '*'
      temperature_k:
        rename: temp_model
        unit_scale: 1
        unit_scale_method: '*'
    variable_summing:
      oa_tot:
        vars:
        - orgpai
        - orgpaj
        - asoa1i
        - asoa1j
        - asoa2i
        - asoa2j
        - asoa3i
        - asoa3j
        - asoa4i
        - asoa4j
        - bsoa1i
        - bsoa1j
        - bsoa2i
        - bsoa2j
        - bsoa3i
        - bsoa3j
        - bsoa4i
        - bsoa4j
        ylabel_plot: Organic Aerosol Total
      SO4A:
        vars:
        - so4aj
        - so4ai
        ylabel_plot: SO4A
      NH4A:
        vars:
        - nh4aj
        - nh4ai
        ylabel_plot: NH4A
      NO3A:
        vars:
        - no3aj
        - no3ai
        ylabel_plot: NO3A
      EC:
        vars:
        - ecj
        - eci
        ylabel_plot: EC
    projection: None
    plot_kwargs:
      color: dodgerblue
      marker: ^
      linestyle: ':'
    type: model
  firexaq:
    filename: /wrk/d2/rschwantes/obs/firex-aq/R1/10s_merge/firexaq-mrg10-dc8_merge_20190905_R1.ict
    obs_type: aircraft
    resample: 600S
    variables:
      OA_PM1_AMS_JIMENEZ:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: OA_PM1_AMS_JIMENEZ
      Sulfate_PM1_AMS_JIMENEZ:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: Sulfate_PM1_AMS_JIMENEZ
      Ammonium_PM1_AMS_JIMENEZ:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: Ammonium_PM1_AMS_JIMENEZ
      Nitrate_PM1_AMS_JIMENEZ:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: Nitrate_PM1_AMS_JIMENEZ
      BC_mass_90_550_nm_SCHWARZ:
        unit_scale: 1000
        unit_scale_method: /
        nan_value: -777777
        LLOD_value: -888888
        LLOD_setvalue: 0.0
        ylabel_plot: BC_mass_90_550_nm_SCHWARZ
      Latitude_YANG:
        rename: latitude
        unit_scale: 1
        unit_scale_method: '*'
      Longitude_YANG:
        rename: longitude
        unit_scale: 1
        unit_scale_method: '*'
      P_BUI:
        rename: pressure_obs
        unit_scale: 100
        unit_scale_method: '*'
      T_BUI:
        rename: temp_obs
        unit_scale: 1
        unit_scale_method: '*'
      MSL_GPS_Altitude_YANG:
        rename: altitude
        unit_scale: 1
        unit_scale_method: '*'
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      ts_select_time: time
      ts_avg_window: null
      set_axis: false
      altitude_yax2:
        altitude_variable: altitude
        altitude_ticks: 1000
        ylabel2: Altitude (m)
        plot_kwargs_y2:
          color: g
        altitude_unit: m
        altitude_scaling_factor: 1
  plot_grp2:
    type: vertprofile
    fig_kwargs:
      figsize:
      - 10
      - 14
    default_plot_kwargs:
      linewidth: 4.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: false
      interquartile_style: shading
    altitude_variable: altitude
    vertprofile_bins:
    - 0
    - 1000
    - 2000
    - 3000
    - 4000
    - 5000
    - 6000
    - 7000
    - 8000
    - 9000
    - 10000
    - 11000
    - 12000
    vmin: null
    vmax: null
  plot_grp3:
    type: violin
    fig_kwargs:
      figsize:
      - 10
      - 8
    text_kwargs:
      fontsize: 25.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: false
  plot_grp4:
    type: scatter_density
    fig_kwargs:
      figsize:
      - 10
      - 10
    default_plot_kwargs:
      linewidth: 4.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: false
      vmin_x: null
      vmax_x: null
      vmin_y: null
      vmax_y: null
    color_map:
      colors:
      - royalblue
      - cyan
      - yellow
      - orange
      over: red
      under: blue
    xlabel: Model
    ylabel: Observation
    title: Scatter Density Plot
    fill: true
    shade_lowest: true
    vcenter: null
    extensions:
    - min
    - max
  plot_grp5:
    type: taylor
    fig_kwargs:
      figsize:
      - 8
      - 8
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: true
  plot_grp6:
    type: boxplot
    fig_kwargs:
      figsize:
      - 8
      - 6
    text_kwargs:
      fontsize: 20.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - firexaq_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: false
stats:
  stat_list:
  - MB
  - MdnB
  - R2
  - RMSE
  round_output: 2
  output_table: false
  output_table_kwargs:
    figsize:
    - 7
    - 3
    fontsize: 12.0
    xscale: 1.4
    yscale: 1.4
    edges: horizontal
  domain_type:
  - all
  domain_name:
  - CONUS
  data:
  - firexaq_wrfchem_v4.2
