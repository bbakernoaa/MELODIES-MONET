analysis:
  output_dir: /scratch1/BMC/rcm2/rhs/monet_example/AEROMMA/processed/jupyter/
  debug: true
data:
  ufsaqm:
    mod_type: ufs
    mapping:
      aeromma:
        no2_ave: NO2_LIF
        no_ave: NO_LIF
        o3_ave: O3_CL
        co: CO_LGR
    variables:
      pres_pa_mid:
        rename: pressure_model
        unit_scale: 1
        unit_scale_method: '*'
      temperature_k:
        rename: temp_model
        unit_scale: 1
        unit_scale_method: '*'
    projection: null
    type: model
  aeromma:
    obs_type: aircraft
    time_var: Time_Start
    resample: 600s
    variables:
      O3_CL:
        unit_scale: 1
        unit_scale_method: '*'
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
      NO_LIF:
        unit_scale: 1000.0
        unit_scale_method: /
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
      NO2_LIF:
        unit_scale: 1000.0
        unit_scale_method: /
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
      CO_LGR:
        nan_value: -7777
        LLOD_value: -8888
        LLOD_setvalue: 0.0
      G_LAT:
        rename: latitude
        unit_scale: 1
        unit_scale_method: '*'
      G_LONG:
        rename: longitude
        unit_scale: 1
        unit_scale_method: '*'
      PW:
        rename: pressure_obs
        unit_scale: 100
        unit_scale_method: '*'
      TW:
        rename: temp_obs
        unit_scale: 1
        unit_scale_method: '*'
      G_ALT:
        rename: altitude
        unit_scale: 1
        unit_scale_method: '*'
      Time_Start:
        rename: time
    type: obs
