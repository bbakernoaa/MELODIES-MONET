analysis:
  start_time: '2024-09-05'
  end_time: '2024-09-07'
  debug: true
  output_dir: ./
  output_dir_read: ./
  save:
    paired:
      method: netcdf
      data: all
  read:
    paired:
      method: netcdf
      filenames:
        tempo_l2_hcho_wrfchem_v4.2:
        - tempo_l2_hcho_wrfchem_v4.2.nc4
data:
  wrfchem_v4.2:
    files: /glade/campaign/acom/acom-da/shawnh/AQ_WATCH/20240905/wrf/wrfout_hourly_d02_2024-09-0[5-7]*
    mod_type: wrfchem
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      tempo_l2_hcho:
        hcho: vertical_column
    projection: null
    surf_only: false
    type: model
  tempo_l2_hcho:
    debug: true
    filename: /glade/campaign/acom/acom-da/sma/TEMPO_HCHO_V03/TEMPO_HCHO_L2_V03_2024090[5-6]*_S0*
    obs_type: sat_swath_clm
    sat_type: tempo_l2_hcho
    variables:
      main_data_quality_flag:
        main_data_quality_flag_max: 0
        var_applied:
        - vertical_column
      vertical_column:
        ylabel_plot: HCHO column
      pressure: {}
      scattering_weights: {}
      amf: {}
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    - auto-region:giorgi
    - auto-region:custom
    domain_name:
    - CONUS
    - CNA
    - custom
    domain_box:
    - 37
    - -108
    - 40
    - -102
    data:
    - tempo_l2_hcho_wrfchem_v4.2
    data_proc:
      ts_offset: (-4, 'h')
      ts_avg_window: h
      set_axis: true
  plot_grp2:
    type: gridded_spatial_bias
    fig_kwargs:
      states: true
      counties: true
    text_kwargs:
      fontsize: 16
    domain_type:
    - all
    - all
    domain_name:
    - CONUS
    - model
    data:
    - tempo_l2_hcho_wrfchem_v4.2
    data_proc:
      set_axis: true
  plot_grp3:
    type: spatial_dist
    fig_kwargs:
      states: true
      counties: false
    text_kwargs:
      fontsize: 16
    domain_type:
    - all
    - all
    domain_name:
    - CONUS
    - model
    data:
    - tempo_l2_hcho_wrfchem_v4.2
    data_proc:
      set_axis: true
      vmax: 1e16
      vmin: 0
  plot_grp4:
    type: taylor
    data:
    - tempo_l2_hcho_wrfchem_v4.2
    domain_type:
    - all
    domain_name:
    - CONUS
    data_proc:
      set_axis: true
      ty_scale: 1.5
    default_plot_kwargs:
      markersize: 10.0
      marker: s
