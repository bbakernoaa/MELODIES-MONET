analysis:
  start_time: '2019-07-15'
  end_time: '2019-07-16'
  debug: true
  output_dir: /Users/mengli/Work/melodies-monet/outdata
  output_dir_save: /Users/mengli/Work/melodies-monet/outdata/save_intermediate
  output_dir_read: /Users/mengli/Work/melodies-monet/outdata/read_intermediate
  save:
    paired:
      method: netcdf
      prefix: '201907'
      data: all
  read:
    paired:
      method: netcdf
      filenames:
        tropomi_l2_no2_wrfchem_v4.2:
        - 201907_tropomi_l2_no2_wrfchem_v4.2.nc4
data:
  wrfchem_v4.2:
    files: /Users/mengli/Work/melodies-monet/modeldata/wrfchem/0715/*
    mod_type: wrfchem
    apply_ak: true
    mod_kwargs:
      mech: racm_esrl_vcp
    mapping:
      tropomi_l2_no2:
        no2: nitrogendioxide_tropospheric_column
    projection: null
    plot_kwargs:
      color: dodgerblue
      marker: ^
      linestyle: ':'
    type: model
  tropomi_l2_no2:
    debug: true
    filename: /Users/mengli/Work/melodies-monet/obsdata/tropomi_no2/20190715/*
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_no2
    variables:
      qa_value:
        quality_flag_min: 0.7
        var_applied:
        - nitrogendioxide_tropospheric_column
        fillvalue: 9.96921e+36
      nitrogendioxide_tropospheric_column:
        scale: 6.022141e+19
        fillvalue: 9.96921e+36
        ylabel_plot: NO2 trop. columns
        vmin_plot: 0.0
        vmax_plot: 1.0e+16
        nlevels_plot: 23
        regulatory: false
      averaging_kernel:
        fillvalue: 9.96921e+36
      air_mass_factor_total:
        fillvalue: 9.96921e+36
      air_mass_factor_troposphere:
        fillvalue: 9.96921e+36
      latitude: None
      longitude: None
      preslev:
        tm5_constant_a:
          group:
          - PRODUCT
          maximum: 9.0e+36
        tm5_constant_b:
          group:
          - PRODUCT
          maximum: 9.0e+36
        surface_pressure:
          group:
          - PRODUCT/SUPPORT_DATA/INPUT_DATA/
          maximum: 9.0e+36
        tm5_tropopause_layer_index:
          group:
          - PRODUCT
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - tropomi_l2_no2_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      ts_select_time: time
      ts_avg_window: H
      set_axis: false
  plot_grp2:
    type: gridded_spatial_bias
    fig_kwargs:
      states: true
      figsize:
      - 10
      - 5
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - tropomi_l2_no2_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: true
  plot_grp3:
    type: taylor
    fig_kwargs:
      figsize:
      - 8
      - 8
    default_plot_kwargs:
      markersize: 10.0
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - tropomi_l2_no2_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: false
  plot_grp4:
    type: boxplot
    fig_kwargs:
      figsize:
      - 8
      - 6
    default_plot_kwargs:
      markersize: 10.0
    text_kwargs:
      fontsize: 20.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - tropomi_l2_no2_wrfchem_v4.2
    data_proc:
      rem_obs_nan: true
      set_axis: true
stats:
  stat_list:
  - MB
  - NMB
  - R2
  - RMSE
  round_output: 2
  output_table: true
  output_table_kwargs:
    figsize:
    - 12
    - 6
    fontsize: 12.0
    xscale: 1.4
    yscale: 1.4
    edges: horizontal
  domain_type:
  - all
  domain_name:
  - CONUS
  data:
  - tropomi_l2_no2_wrfchem_v4.2
