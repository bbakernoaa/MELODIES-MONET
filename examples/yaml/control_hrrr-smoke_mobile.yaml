analysis:
  start_time: 2022-09-11-06:00:00
  end_time: 2022-09-12-06:00:00
  output_dir: /wrk/charkins/melodies_monet/aircraft/develop_aircraft_mobile/Output_hrrr-smoke
  debug: true
data:
  hrrr-smoke:
    files: /wrk/users/charkins/megan_mobile_data/HRRR/aqm_HRRR-Smoke_2022091106.nc.subset.nc
    mod_type: random
    mapping:
      mobile_fire:
        PM2_5_DRY: PM2.5_5min
        TMP_2maboveground: Temperature_5min
    plot_kwargs:
      color: dodgerblue
      marker: ^
      linestyle: ':'
    type: model
  mobile_fire:
    filename: /wrk/users/charkins/megan_mobile_data/Fire_obs_all/treated_final_modtime.csv
    obs_type: mobile
    resample: 600S
    time_var: time_5min
    variables:
      PM2.5_5min:
        unit_scale: 1
        unit_scale_method: '*'
        ylabel_plot: PM2.5 (units?)
      Temperature_5min:
        unit_scale: 273.15
        unit_scale_method: +
        ylabel_plot: Temperature (K)
      Latitude_5min:
        rename: latitude
        unit_scale: 1
        unit_scale_method: '*'
      Longitude_5min:
        rename: longitude
        unit_scale: 1
        unit_scale_method: '*'
    type: obs
plotting:
  plot_grp1:
    type: timeseries
    fig_kwargs:
      figsize:
      - 12
      - 6
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 18.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - mobile_fire_hrrr-smoke
    data_proc:
      rem_obs_nan: true
      ts_select_time: time
      ts_avg_window: null
      set_axis: false
  plot_grp2:
    type: taylor
    fig_kwargs:
      figsize:
      - 8
      - 8
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - mobile_fire_hrrr-smoke
    data_proc:
      rem_obs_nan: true
      set_axis: true
  plot_grp3:
    type: boxplot
    fig_kwargs:
      figsize:
      - 8
      - 6
    text_kwargs:
      fontsize: 20.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - mobile_fire_hrrr-smoke
    data_proc:
      rem_obs_nan: true
      set_axis: false
stats:
  stat_list:
  - MB
  - MdnB
  - R2
  - RMSE
  round_output: 2
  output_table: false
  output_table_kwargs:
    figsize:
    - 7
    - 3
    fontsize: 12.0
    xscale: 1.4
    yscale: 1.4
    edges: horizontal
  domain_type:
  - all
  domain_name:
  - CONUS
  data:
  - mobile_fire_hrrr-smoke
