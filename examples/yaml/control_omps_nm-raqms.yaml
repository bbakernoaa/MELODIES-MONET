analysis:
  start_time: 2019-08-01-00:00:00
  end_time: 2019-09-01-00:00:00
  time_interval: 5D
  debug: true
  output_dir: /ships19/aqda/mbruckner/monet_plots
  save:
    paired:
      method: netcdf
      prefix: firex_omps
      data: all
  read:
    paired:
      method: netcdf
      filenames:
        omps_nm_raqms:
        - firex_omps_*_omps_nm_raqms.nc4
data:
  raqms:
    files: /ships19/aqda/mbruckner/MELODIES-MONET-1/examples/jupyter_notebooks/raqms-files.txt
    mod_type: raqms
    apply_ak: true
    variables:
      o3vmr:
        need: true
    mapping:
      omps_nm:
        o3vmr: ozone_column
    plot_kwargs:
      color: purple
      marker: ^
      linestyle: dotted
    type: model
  omps_nm:
    filename: /ships19/aqda/mbruckner/OMPS-NPP/O3-daily/2019/nadir_mapper/OMPS-NPP_NMTO3-L2_v2.1_2019m08*t*.h5
    obs_type: sat_swath_clm
    sat_type: omps_nm
    variables:
      ozone_column:
        ylabel_plot: DU
    type: obs
plotting:
  plot_grp2:
    type: taylor
    fig_kwargs:
      figsize:
      - 8
      - 8
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.0
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - Global
    data:
    - omps_nm_raqms
    data_proc:
      rem_obs_nan: true
      set_axis: true
  plot_grp3:
    type: gridded_spatial_bias
    fig_kwargs:
      states: true
      figsize:
      - 10
      - 5
    text_kwargs:
      fontsize: 16.0
    domain_type:
    - all
    domain_name:
    - Global
    data:
    - omps_nm_raqms
    data_proc:
      rem_obs_nan: true
      set_axis: true
