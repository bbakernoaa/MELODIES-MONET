        vmax_reg_plot: 70.0
        vdiff_reg_plot: 15.0
      WS:
        unit_scale: 0.514
        unit_scale_method: '*'
        obs_min: 0.2
      PRSFC:
        unit_scale: 0.01
        unit_scale_method: '*'
      PRECIP:
        unit_scale: 0.1
        unit_scale_method: '*'
      TEMP:
