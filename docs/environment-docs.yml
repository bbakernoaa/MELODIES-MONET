# Conda environment for building the MELODIES-MONET docs
name: melodies-monet-docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  #
  # Non-python / heavy dependencies
  - cartopy
  - matplotlib-base<3.9  # for pandas v1 compat
  - netcdf4
  - numpy
  - pandas<2
  - pillow<10
  #
  # Common utilities
  - networkx
  - jinja2
  - pyyaml
  - numba
  - pooch
  - timezonefinder
  - typer
  - wrf-python  # for WRF-Chem reader in monetio
  #
  # Prefect and Dask
  - prefect
  - dask-jobqueue
  #
  # Docs tools
  - ipykernel
  - jupyterlab=4.*
  - jupytext
  - myst-nb>=0.14
  - nbclient
  - sphinx=7.*
  - sphinx-autobuild
  - sphinx-click
  - sphinx-design
  - sphinx_rtd_theme
  - sphinx-togglebutton
  #
  - pip
  - pip:
    # Pre-install git dependencies to guide the resolver
    - "monet @ git+https://github.com/noaa-oar-arl/monet.git@develop"
    - "monetio @ git+https://github.com/bbakernoaa/monetio.git@develop"
    - "monet-stats @ git+https://github.com/bbakernoaa/monet-stats.git@main"
    - "monet-plots @ git+https://github.com/bbakernoaa/monet-plots.git@main"
    # melodies_monet itself
    - '-e ../'
