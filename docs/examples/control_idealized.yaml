analysis:
  start_time: 2019-09-09 00:00
  end_time: 2019-09-10 00:00
  output_dir: ./output/idealized
  debug: true
  save:
    paired:
      method: netcdf
      prefix: asdf
      data: all
  read:
    paired:
      method: netcdf
      filenames:
        test_obs_test_model: asdf_test_obs_test_model.nc4
data:
  test_model:
    files: test_model.nc
    mod_type: random
    variables:
      A:
        units: Units of A
        unit_scale: 1
        unit_scale_method: '*'
      B:
        units: Units of B
        unit_scale: 1
        unit_scale_method: '*'
    mapping:
      test_obs:
        A: A_obs
        B: B_obs
    projection: null
    type: model
  test_obs:
    obs_type: pt_sfc
    type: obs
    files: test_obs.nc
plotting:
  plot_grp1:
    type: timeseries
    default_plot_kwargs:
      linewidth: 2.0
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - test_obs_test_model
    data_proc:
      rem_obs_nan: true
      ts_select_time: time
      ts_avg_window: 3h
      set_axis: false
  plot_grp2:
    type: spatial_overlay
    fig_kwargs:
      states: true
      figsize:
      - 10
      - 5
    domain_type:
    - all
    domain_name:
    - CONUS
    data:
    - test_obs_test_model
    data_proc:
      rem_obs_nan: true
      set_axis: true
evaluations:
  test_obs_test_model:
    model: test_model
    obs: test_obs
    mapping:
      A: A_obs
      B: B_obs
