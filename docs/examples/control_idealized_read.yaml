analysis:
  debug: true
  end_time: 2019-09-10 00:00
  output_dir: ./output/idealized
  read:
    paired:
      filenames:
        test_obs_test_model: asdf_test_obs_test_model.nc4
      method: netcdf
  start_time: 2019-09-09 00:00
model:
  test_model:
    files: test_model.nc
    mapping:
      test_obs:
        A: A_obs
        B: B_obs
    mod_type: random
    projection: null
    variables:
      A:
        unit_scale: 1
        unit_scale_method: '*'
        units: Units of A
      B:
        unit_scale: 1
        unit_scale_method: '*'
        units: Units of B
obs:
  test_obs:
    filename: test_obs.nc
    obs_type: pt_sfc
plots:
  plot_grp1:
    data:
    - test_obs_test_model
    data_proc:
      rem_obs_nan: true
      set_axis: false
      ts_avg_window: 3h
      ts_select_time: time
    default_plot_kwargs:
      linewidth: 2.0
    domain_name:
    - CONUS
    domain_type:
    - all
    type: timeseries
  plot_grp2:
    data:
    - test_obs_test_model
    data_proc:
      rem_obs_nan: true
      set_axis: true
    domain_name:
    - CONUS
    domain_type:
    - all
    fig_kwargs:
      figsize:
      - 10
      - 5
      states: true
    type: spatial_overlay
