name: Regression Testing

on:
  push:
    branches: [ main, develop, MM2, 'jules-*' ]
  pull_request:
    branches: [ main, develop, MM2 ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up micromamba
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: docs/environment-docs.yml
        cache-environment: true
        create-args: >-
          pytest
          pytest-mpl

    - name: Install Dependencies and Core Repositories
      shell: bash -l {0}
      run: |
        python -m pip install --upgrade pip
        python -m pip install --force-reinstall --no-deps git+https://github.com/bbakernoaa/monetio.git@develop
        python -m pip install --force-reinstall --no-deps git+https://github.com/bbakernoaa/monet.git@feature/interp_improvements
        python -m pip install --force-reinstall --no-deps git+https://github.com/bbakernoaa/monet-stats.git@dev
        python -m pip install --force-reinstall --no-deps git+https://github.com/bbakernoaa/monet-plots.git@main
        python -m pip install prefect prefect-dask dask-jobqueue dask-cloudprovider

    - name: Install MELODIES-MONET
      shell: bash -l {0}
      run: |
        python -m pip install -e .

    - name: Run Regression Tests
      shell: bash -l {0}
      run: |
        python -m pytest melodies_monet/tests/test_regression.py
